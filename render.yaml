services:
  - type: web
    name: vann-sitha-attendance
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Phnom_Penh
      - key: PORT
        value: 3000
      - key: ADMIN_PIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_LEAVE_CHAT_ID
        sync: false
      - key: TELEGRAM_LEAVE_ENABLED
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true
